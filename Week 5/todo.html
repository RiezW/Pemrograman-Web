<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <h1>Task Tracker Kuliah</h1>
        <form id="taskform" novalidate>
            <div class="bagianatas">
                <input id="judul" type="text" placeholder="Judul tugas (min. 3 karakter)" required>
                <select name="Mata Kuliah" id="matkul" required>
                    <option value="" disabled selected hidden>-- Pilih Mata Kuliah --</option>
                    <option value="Ethical Hacking dan Uji Keamanan Siber">Ethical Hacking dan Uji Keamanan Siber</option>
                    <option value="Keamanan Jaringan Komputer">Keamanan Jaringan Komputer</option>
                    <option value="Pemrograman Web">Pemrograman Web</option>
                </select>
                <input id="deadline" type="date" required>
                <button type="submit">Tambah</button>
            </div>

        </form>
        <p id="formerror" role="alert" aria-live="polite"></p>

        <div class="bagianbawah">
            <button id="semua" type="button" data-filter="semua">semua</button>
            <button id="aktif" type="button" data-filter="aktif">aktif</button>
            <button id="selesai" type="button" data-filter="selesai">selesai</button>
        </div>

        <ul id="tasklist"></ul>
    </div>
    <script src="todo.js"></script>
</body>
</html>
